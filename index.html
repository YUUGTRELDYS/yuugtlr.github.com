<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Official YUUGTRL Roblox UI scripts. Automatically synced from GitHub.">
    <title>YUUGTRL — Official Roblox UI Scripts</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20145%20145'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='0'%3E%3Cstop%20offset='0%25'%20stop-color='%23a855f7'/%3E%3Cstop%20offset='100%25'%20stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx='72.5'%20cy='72.5'%20r='65'%20fill='%23000000'/%3E%3Ctext%20x='72.5'%20y='72.5'%20text-anchor='middle'%20dominant-baseline='central'%20font-family='Arial'%20font-weight='900'%20font-size='24'%20fill='url(%23g)'%3EYUUGTRL%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        :root {
            --bg: #050505;
            --panel: #0a0a0a;
            --border: rgba(255,255,255,0.10);
            --border-hover: rgba(236,72,153,0.45);
            --text: #ffffff;
            --muted: #9ca3af;
            --violet: #7c3aed;
            --violet-deep: #6d28d9;
            --pink: #ec4899;
            --pink-dim: rgba(236,72,153,0.12);
            --yellow: #facc15;
            --red: #f43f5e;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        ::selection { background: rgba(124,58,237,0.40); color: #fff; }

        .wrap { position: relative; }

        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: rgba(5,5,5,0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.02em;
            color: #fff;
            text-decoration: none;
        }

        .logo-circle {
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 14px rgba(236,72,153,0.55));
        }

        .logo-text {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 9px 16px;
            border-radius: 10px;
            transition: background 0.2s, color 0.2s;
        }

        .nav-links a:hover { background: rgba(255,255,255,0.06); color: #fff; }

        .hero {
            min-height: 92vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 160px 24px 80px;
            background:
                radial-gradient(55% 45% at 50% 0%, rgba(109,40,217,0.20), transparent 70%),
                radial-gradient(40% 35% at 85% 70%, rgba(236,72,153,0.12), transparent 70%);
        }

        .hero h1 {
            font-size: clamp(52px, 11vw, 116px);
            font-weight: 900;
            line-height: 0.98;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #a855f7 10%, #ec4899 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 8px 50px rgba(236,72,153,0.35));
        }

        .hero .tagline {
            margin-top: 22px;
            font-size: clamp(16px, 2.4vw, 20px);
            color: var(--muted);
            max-width: 600px;
            line-height: 1.6;
        }

        .section {
            max-width: 1100px;
            margin: 0 auto;
            padding: 70px 24px 90px;
        }

        .sync-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 20px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 500;
        }

        .sync-bar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ec4899;
            box-shadow: 0 0 8px rgba(236,72,153,0.7);
            flex-shrink: 0;
        }

        .sync-bar.checking .dot { background: var(--yellow); box-shadow: 0 0 8px rgba(250,204,21,0.7); animation: pulse 0.8s infinite; }
        .sync-bar.error .dot { background: var(--red); box-shadow: 0 0 8px rgba(244,63,94,0.7); }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        .refresh-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 9px;
            padding: 7px 11px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: all 0.2s;
        }

        .refresh-btn:hover { color: #fff; border-color: var(--border-hover); }
        .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .scripts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .script-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
            transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }

        .script-card:hover {
            transform: translateY(-3px);
            border-color: var(--border-hover);
            background: #0d0d0d;
        }

        .script-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
            word-break: break-word;
            line-height: 1.3;
        }

        .script-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 500;
        }

        .script-meta .ava {
            width: 20px;
            height: 20px;
            border-radius: 999px;
            background: #000;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .size-badge {
            padding: 3px 9px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px;
        }

        .script-desc {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            flex: 1;
            min-height: 22px;
            word-break: break-word;
        }

        .script-desc.placeholder { color: #6b7280; font-style: italic; }

        .script-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            min-width: 0;
        }

        .script-load {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px;
            color: #6b7280;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .load-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
            transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .load-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(236,72,153,0.4); }

        .load-btn.copied { background: linear-gradient(135deg, #84cc16, #a3e635); color: #1a2e05; box-shadow: 0 8px 24px rgba(163,230,53,0.35); }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            border: 1px dashed var(--border);
            border-radius: 18px;
            color: var(--muted);
        }

        .empty-state .err { color: var(--red); margin-top: 8px; font-size: 13px; }

        footer {
            border-top: 1px solid var(--border);
            padding: 32px 24px;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.8;
        }

        .foot-logo {
            width: 28px;
            height: 28px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
            filter: drop-shadow(0 0 10px rgba(236,72,153,0.4));
        }

        @media (max-width: 860px) {
            .scripts-grid { grid-template-columns: 1fr; }
            .nav-links { display: none; }
            nav { padding: 14px 18px; }
            .section { padding: 54px 18px 70px; }
        }
    </style>
</head>
<body>
    <div class="wrap">

        <nav>
            <a href="#" class="logo">
                <svg class="logo-circle" viewBox="0 0 145 145" aria-hidden="true">
                    <defs>
                        <linearGradient id="yuuTextNav" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#a855f7"/>
                            <stop offset="100%" stop-color="#ec4899"/>
                        </linearGradient>
                    </defs>
                    <circle cx="72.5" cy="72.5" r="65" fill="#000000" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
                    <text x="72.5" y="72.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="22" letter-spacing="-1" fill="url(#yuuTextNav)">YUUGTRL</text>
                </svg>
                <span class="logo-text">YUUGTRL</span>
            </a>
            <div class="nav-links">
                <a href="#scripts">Scripts</a>
            </div>
        </nav>

        <header class="hero">
            <h1>YUUGTRL</h1>
        </header>

        <section class="section" id="scripts">
            <div class="sync-bar" id="syncBar">
                <span class="dot"></span>
                <span id="syncText">Checking for updates...</span>
                <button class="refresh-btn" id="refreshBtn" title="Check for updates">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                </button>
            </div>
            <div class="scripts-grid" id="scriptsGrid">
                <div class="empty-state">Loading scripts...</div>
            </div>
        </section>

        <footer>
            <svg class="foot-logo" viewBox="0 0 145 145" aria-hidden="true">
                <defs>
                    <linearGradient id="yuuTextFoot" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#a855f7"/>
                        <stop offset="100%" stop-color="#ec4899"/>
                    </linearGradient>
                </defs>
                <circle cx="72.5" cy="72.5" r="65" fill="#000000" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
                <text x="72.5" y="72.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="22" letter-spacing="-1" fill="url(#yuuTextFoot)">YUUGTRL</text>
            </svg>
            YUUGTRL · All rights reserved.
        </footer>

    </div>

    <script>
        const REPO = "YUUGTRELDYS/YUUGTRL";
        const BRANCH = "main";
        const API_URL = "https://api.github.com/repos/" + REPO + "/contents/?ref=" + BRANCH;
        const RAW_URL = "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/";
        const CDN_URL = "https://cdn.jsdelivr.net/gh/" + REPO + "@" + BRANCH + "/";
        const AUTHOR = "YUUGTRL";

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text);
            } else {
                const ta = document.createElement("textarea");
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                ta.remove();
            }
        }

        function formatSize(bytes) {
            if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";
            return Math.max(1, Math.round(bytes / 1024)) + " KB";
        }

        function isScriptFile(name) {
            const lower = name.toLowerCase();
            const skip = [".md", ".txt", ".png", ".jpg", ".jpeg", ".gif", ".svg", ".ico", ".json", ".yml", ".yaml", ".html", ".zip", ".rar"];
            for (let i = 0; i < skip.length; i++) {
                if (lower.endsWith(skip[i])) return false;
            }
            return true;
        }

        function extractDescription(code) {
            const lines = code.split("\n");
            const parts = [];
            for (let i = 0; i < lines.length && i < 8; i++) {
                const line = lines[i].trim();
                if (line === "" || line === "\r") continue;
                const m = line.match(/^\s*--+\s*(.+)$/);
                if (m) parts.push(m[1].trim());
            }
            return parts.join(" ");
        }

        const grid = document.getElementById("scriptsGrid");
        const syncBar = document.getElementById("syncBar");
        const syncText = document.getElementById("syncText");

        function setStatus(mode, text) {
            syncBar.classList.remove("checking", "error");
            if (mode) syncBar.classList.add(mode);
            syncText.textContent = text;
        }

        function renderScripts(files) {
            grid.innerHTML = "";
            if (files.length === 0) {
                grid.innerHTML = '<div class="empty-state">No scripts yet.</div>';
                return;
            }

            files.forEach(function(f) {
                const card = document.createElement("div");
                card.className = "script-card";
                card.innerHTML =
                    '<div class="script-name">' + f.name + '</div>' +
                    '<div class="script-meta">' +
                        '<span class="ava">' +
                            '<svg viewBox="0 0 145 145" style="width:100%;height:100%;display:block;">' +
                                '<defs>' +
                                    '<linearGradient id="yuuTextAva' + f.id + '" x1="0" y1="0" x2="1" y2="0">' +
                                        '<stop offset="0%" stop-color="#a855f7"/>' +
                                        '<stop offset="100%" stop-color="#ec4899"/>' +
                                    '</linearGradient>' +
                                '</defs>' +
                                '<circle cx="72.5" cy="72.5" r="65" fill="#000"/>' +
                                '<text x="72.5" y="72.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="22" letter-spacing="-1" fill="url(#yuuTextAva' + f.id + ')">YUUGTRL</text>' +
                            '</svg>' +
                        '</span>' + AUTHOR +
                        '<span class="size-badge">' + f.sizeText + '</span>' +
                    '</div>' +
                    '<div class="script-desc">' + f.desc + '</div>' +
                    '<div class="script-row">' +
                        '<div class="script-load" title="' + f.load.replace(/"/g, "&quot;") + '">' + f.load + '</div>' +
                        '<button class="load-btn" data-load="' + f.load.replace(/"/g, "&quot;") + '">' +
                            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
                            'Copy' +
                        '</button>' +
                    '</div>';
                grid.appendChild(card);
            });
        }

        async function loadScripts() {
            setStatus("checking", "Checking for updates...");
            const refreshBtn = document.getElementById("refreshBtn");
            refreshBtn.classList.add("spinning");
            try {
                const res = await fetch(API_URL, { cache: "no-store" });
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();
                const files = (data || [])
                    .filter(function(f) { return f.type === "file" && isScriptFile(f.name); })
                    .map(function(f) {
                        const name = f.name;
                        const sizeText = formatSize(f.size || 0);
                        const load = "loadstring(game:HttpGet('" + RAW_URL + encodeURIComponent(name) + "'))()";
                        return {
                            name: name,
                            sizeText: sizeText,
                            load: load,
                            raw: RAW_URL + encodeURIComponent(name),
                            desc: '<span class="placeholder">Loading description...</span>'
                        };
                    })
                    .sort(function(a, b) { return a.name.localeCompare(b.name); });

                renderScripts(files);

                await Promise.all(files.map(function(f) {
                    return fetch(f.raw, { cache: "no-store" })
                        .then(function(r) { return r.ok ? r.text() : null; })
                        .then(function(code) {
                            if (!code) return;
                            const desc = extractDescription(code);
                            f.desc = desc || f.name;
                            const cards = grid.querySelectorAll(".script-card");
                            const card = cards[files.indexOf(f)];
                            if (card) card.querySelector(".script-desc").textContent = f.desc;
                        })
                        .catch(function() {});
                }));

                const now = new Date();
                const time = now.getHours().toString().padStart(2, "0") + ":" + now.getMinutes().toString().padStart(2, "0");
                setStatus("", "Updated at " + time + " · " + files.length + " scripts");
            } catch (err) {
                setStatus("error", "Connection error");
                grid.innerHTML =
                    '<div class="empty-state">Failed to load scripts.' +
                    '<div class="err">' + err.message + '</div>' +
                    '<button class="refresh-btn" style="margin-top:14px;" onclick="loadScripts()">Retry</button></div>';
            } finally {
                refreshBtn.classList.remove("spinning");
            }
        }

        grid.addEventListener("click", function(e) {
            const btn = e.target.closest(".load-btn");
            if (!btn) return;
            copyText(btn.getAttribute("data-load"));
            btn.classList.add("copied");
            btn.innerHTML = "Copied";
            setTimeout(function() {
                btn.classList.remove("copied");
                btn.innerHTML =
                    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
                    'Copy';
            }, 1800);
        });

        document.getElementById("refreshBtn").addEventListener("click", loadScripts);

        loadScripts();
        setInterval(loadScripts, 5 * 60 * 1000);
    </script>
</body>
</html>
