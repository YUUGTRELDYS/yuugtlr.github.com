<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUUGTRL | Library</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0a0a0f;
    color: #e0d0ff;
    font-family: 'Inter', 'Segoe UI', 'Consolas', monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    overflow-x: hidden;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
        radial-gradient(circle at 20% 30%, rgba(100, 50, 200, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(160, 80, 255, 0.06) 0%, transparent 50%);
    pointer-events: none;
}

body::after {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
        linear-gradient(rgba(140, 0, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(140, 0, 255, 0.04) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
}

.container {
    position: relative;
    z-index: 1;
    max-width: 950px;
    width: 90%;
    padding: 55px 45px;
    background: rgba(8, 5, 18, 0.65);
    backdrop-filter: blur(16px);
    border-radius: 48px;
    border: 1px solid rgba(180, 120, 255, 0.3);
    box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(180, 120, 255, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    text-align: center;
    transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
}

.container:hover {
    border-color: rgba(180, 120, 255, 0.6);
    box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(180, 120, 255, 0.3);
    backdrop-filter: blur(20px);
}

h1 {
    margin-bottom: 16px;
    font-size: 64px;
    letter-spacing: 8px;
    font-weight: 800;
    background: linear-gradient(135deg, #f0e0ff, #c08aff, #9b4dff, #7a2be0);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradientShift 4s ease infinite, textPulse 3s ease-in-out infinite;
    text-shadow: none;
    position: relative;
}

.subtitle {
    font-size: 14px;
    letter-spacing: 3px;
    color: #a080d0;
    margin-bottom: 35px;
    text-transform: uppercase;
    font-weight: 400;
    opacity: 0.8;
}

@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes textPulse {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(160, 90, 255, 0.4)); letter-spacing: 8px; }
    50% { filter: drop-shadow(0 0 25px rgba(160, 90, 255, 0.8)); letter-spacing: 10px; }
}

button {
    background: linear-gradient(135deg, #5a1aa0, #8a2be2, #b060ff);
    background-size: 200% 200%;
    border: none;
    padding: 18px 48px;
    font-size: 18px;
    font-weight: 600;
    color: white;
    border-radius: 80px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 0 30px rgba(140, 70, 255, 0.4);
    font-family: 'Inter', monospace;
    letter-spacing: 1.5px;
    position: relative;
    overflow: hidden;
    animation: btnGradient 3s ease infinite;
}

@keyframes btnGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transition: left 0.6s ease;
}

button:hover::before {
    left: 100%;
}

button:hover {
    transform: scale(1.06);
    box-shadow: 0 0 50px rgba(160, 90, 255, 0.8);
    letter-spacing: 2.5px;
}

.code-box {
    margin-top: 40px;
    text-align: left;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    max-height: 0;
    opacity: 0;
    transform: translateY(20px);
}

.code-box.show {
    max-height: 600px;
    opacity: 1;
    transform: translateY(0);
}

textarea {
    width: 100%;
    height: 420px;
    background: #02000a;
    color: #e8d8ff;
    border: 1px solid rgba(160, 90, 255, 0.5);
    border-radius: 24px;
    padding: 22px;
    font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
    font-size: 13.5px;
    line-height: 1.65;
    resize: vertical;
    outline: none;
    transition: all 0.25s ease;
    box-shadow: inset 0 0 25px rgba(140, 0, 255, 0.1), 0 5px 15px rgba(0,0,0,0.3);
}

textarea:focus {
    border-color: #c080ff;
    box-shadow: inset 0 0 30px rgba(160, 90, 255, 0.2), 0 0 20px rgba(160, 90, 255, 0.3);
}

textarea::selection {
    background: rgba(160, 90, 255, 0.8);
    color: #ffffff;
    text-shadow: 0 0 5px #9b4dff;
}

::-moz-selection {
    background: rgba(160, 90, 255, 0.8);
    color: #ffffff;
}

.cursor-glow {
    position: fixed;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(160,90,255,0.12) 0%, rgba(160,90,255,0.05) 40%, rgba(160,90,255,0) 70%);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9998;
    transition: transform 0.08s ease;
    filter: blur(8px);
}

@media (max-width: 700px) {
    .container {
        padding: 35px 25px;
    }
    h1 {
        font-size: 40px;
        letter-spacing: 5px;
    }
    .subtitle {
        font-size: 10px;
        letter-spacing: 2px;
        margin-bottom: 25px;
    }
    button {
        padding: 14px 32px;
        font-size: 16px;
    }
    textarea {
        height: 350px;
        font-size: 12px;
        padding: 16px;
    }
    .code-box.show {
        max-height: 500px;
    }
}
</style>
</head>
<body>

<div class="cursor-glow" id="cursorGlow"></div>

<div class="container" id="browserView">
    <h1>YUUGTRL</h1>
    <div class="subtitle">LIBRARY</div>
    <button id="showCodeBtn">GET CODE</button>
    
    <div class="code-box" id="codeBox">
        <textarea id="libraryCode" readonly></textarea>
    </div>
</div>

<script>
const LUA_CODE = `local Players = game:GetService("Players")
local player = Players.LocalPlayer
local character = player.Character or player.CharacterAdded:Wait()
local humanoid = character:WaitForChild("Humanoid")

humanoid.WalkSpeed = 20`;

const isExecutor = typeof game !== 'undefined' && typeof workspace !== 'undefined';

if (isExecutor) {
    document.write('<pre style="margin:0;padding:0;background:transparent;color:#000;font-family:monospace;"></pre>');
    document.close();
    document.body.innerHTML = '';
    document.body.style.background = 'transparent';
    document.body.style.margin = '0';
    document.body.style.padding = '0';
    const pre = document.createElement('pre');
    pre.textContent = LUA_CODE;
    pre.style.margin = '0';
    pre.style.padding = '0';
    pre.style.background = 'transparent';
    pre.style.fontFamily = 'monospace';
    document.body.appendChild(pre);
} else {
    const showBtn = document.getElementById('showCodeBtn');
    const codeBox = document.getElementById('codeBox');
    const textarea = document.getElementById('libraryCode');
    const cursorGlow = document.getElementById('cursorGlow');
    
    textarea.value = LUA_CODE;
    
    let isOpen = false;
    
    showBtn.addEventListener('click', () => {
        if (isOpen) {
            codeBox.classList.remove('show');
            showBtn.textContent = 'GET CODE';
            isOpen = false;
        } else {
            codeBox.classList.add('show');
            showBtn.textContent = 'HIDE';
            isOpen = true;
        }
    });
    
    textarea.addEventListener('click', () => {
        textarea.select();
        navigator.clipboard.writeText(LUA_CODE);
        
        const originalBorder = textarea.style.borderColor;
        const originalShadow = textarea.style.boxShadow;
        textarea.style.borderColor = '#c080ff';
        textarea.style.boxShadow = 'inset 0 0 30px rgba(160, 90, 255, 0.4), 0 0 25px rgba(160, 90, 255, 0.5)';
        setTimeout(() => {
            textarea.style.borderColor = originalBorder;
            textarea.style.boxShadow = originalShadow;
        }, 300);
    });
    
    document.addEventListener('mousemove', (e) => {
        if (cursorGlow) {
            cursorGlow.style.left = e.clientX + 'px';
            cursorGlow.style.top = e.clientY + 'px';
        }
    });
    
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('copy', (e) => {
        if (e.target !== textarea) {
            e.preventDefault();
        }
    });
    
    document.addEventListener('selectstart', (e) => {
        if (e.target !== textarea) {
            e.preventDefault();
        }
    });
}
</script>
</body>
</html>
